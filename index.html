<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <title>風月 v2</title>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="風月">
    <meta name="application-name" content="風月">
    <meta name="theme-color" content="#faf9f6">
    
    <link rel="icon" type="image/png" sizes="192x192" href="icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icon.png">
    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 🐾 おみ句じ猫ボタン -->
    <img id="fixedCatBtn" src="omikuji-cat.png" alt="おみ句じを引く" class="fixed-cat-trigger hidden" onclick="triggerRandomOmikuji()" title="おみ句じを引く">

    <!-- 🚪 ① トップ画面 -->
    <div id="startScreen" class="step-screen active">
        <div class="top-icon-container">
            <div class="top-icon-block" onclick="startYomuMode()">
                <img src="icon_top_input.png" alt="読む" class="top-icon-img">
                <span class="top-icon-sub">今までの作品</span>
            </div>
            <div class="top-icon-block" onclick="startEmuMode()">
                <img src="icon_top_output.png" alt="詠む" class="top-icon-img">
                <span class="top-icon-sub">俳句の入力</span>
            </div>
        </div>

        <!-- ▼▼ トップ画面右下の暦表示ウィジェット ▼▼ -->
        <div id="calendarWidget" class="calendar-widget">
            <p class="cal-line" id="calEraYear"></p>
            <p class="cal-line"><span class="cal-large" id="calGregorianDate"></span><span id="calWafu"></span></p>
            <p class="cal-line" id="calLunar"></p>
            <p class="cal-line" id="calSolarTerm"></p>
            <p class="cal-line" id="calMicroseason"></p>
            <p class="cal-line" id="calHaikuEvent"></p>
        </div>
        <!-- ▲▲ 追加ここまで ▲▲ -->
    </div>

    <!-- 📖 「読む」画面 -->
    <div id="readScreen" class="step-screen">
        <div class="read-header">
            <div class="read-header-top">
                <div class="breadcrumb">
                    <span class="link" onclick="goToStartScreen()">home</span>
                    <span class="separator">&lt;</span>
                    <span class="current">俳句を読む</span>
                </div>
                
                <div id="searchWrapper" class="subtle-search-wrapper" onclick="expandSearchInput()">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="kigoFilterInput" class="subtle-search-input" placeholder="季語検索" oninput="onKigoFilterInputChanged()" onblur="collapseSearchIfEmpty()">
                    <span id="clearKigoFilterBtn" class="search-clear-btn hidden" onclick="clearKigoFilter(event)">✕</span>
                </div>
            </div>

            <div class="read-title-center">西田上酢 句帳</div>
        </div>
        
        <div class="read-tab-text-group">
            <span id="tabKansei" class="text-tab active" onclick="switchReadTab('完成句')">完成句</span>
            <span class="text-tab-divider">｜</span>
            <span id="tabShitagaki" class="text-tab" onclick="switchReadTab('下書き')">下書き</span>
        </div>

        <div id="readHaikuList" class="horizontal-scroll-container saijiki-scroll-list">
        </div>
    </div>

    <!-- 🎲 おみ句じ鑑賞スクリーン -->
    <div id="omikujiRoomScreen" class="step-screen">
        <div class="read-header">
            <div class="breadcrumb">
                <span class="link" onclick="goToStartScreen()">home</span>
                <span class="separator">&lt;</span>
                <span class="link" onclick="startYomuMode()">俳句を読む</span>
                <span class="separator">&lt;</span>
                <span class="current">おみ句じ</span>
            </div>
        </div>
        <button id="prevBtn" class="nav-arrow arrow-right" onclick="changeOmikujiHaiku(-1)">＞</button> 
        <button id="nextBtn" class="nav-arrow arrow-left" onclick="changeOmikujiHaiku(1)">＜</button>  
        <div class="haiku-screen">
            <p id="omikujiPhrase" class="phrase"></p>
        </div>
    </div>

    <!-- 💡 モーダル（右上✕ボタン付き） -->
    <div id="haikuDetailModal" class="card-overlay hidden" onclick="closeHaikuDetailModal()">
        <div class="modal-card-content" onclick="event.stopPropagation()">
            <span class="modal-close-corner" onclick="closeHaikuDetailModal()">✕</span>
            <div id="modalPhrase" class="modal-phrase-single-line"></div>
            <div id="modalActions" class="modal-text-actions"></div>
        </div>
    </div>

    <!-- 🖋️ ステップ1：句の入力 -->
    <div id="step1" class="step-screen">
        <div class="step-title">【一】 句の入力</div>
        <div class="input-screen-content">
            <div class="input-dock">
                <input type="text" id="inputPhrase" class="dock-input" placeholder="ここに一句入力してください" autocomplete="off">
            </div>
            <div class="btn-group">
                <button class="btn btn-outline" onclick="cancelEmuMode()">戻る</button>
                <button class="btn" onclick="goToStep2()">次へ（季語確認）</button>
            </div>
        </div>
    </div>

    <!-- 🏷️ ステップ2：情報の確認 -->
    <div id="step2" class="step-screen">
        <div class="step-title">【二】 情報の確認</div>
        <div class="step2-content">
            <div class="kigo-check-card">
                <div class="kigo-prompt">
                    自動検出された季語<br>
                    <div id="detectedKigoText" style="margin-top: 5px; font-weight: bold;"></div>
                </div>
                <div class="form-group" style="margin-top: 15px;">
                    <label class="form-label">季語（親季語）</label>
                    <input type="text" id="kigoInput" class="text-input" placeholder="例：酉の市、桜" onblur="checkAndHokanKigoData()">
                </div>
                <div class="form-group">
                    <label class="form-label">季節</label>
                    <select id="seasonSelect" class="text-input">
                        <option value="haru">春</option>
                        <option value="natsu">夏</option>
                        <option value="aki">秋</option>
                        <option value="huyu">冬</option>
                        <option value="shinnen">新年</option>
                        <option value="muki">無季</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">詳細季節</label>
                    <select id="detailSeasonSelect" class="text-input">
                        <option value="">（選択なし）</option>
                        <option value="新年">新年</option>
                        <option value="初春">初春</option>
                        <option value="仲春">仲春</option>
                        <option value="晩春">晩春</option>
                        <option value="三春">三春</option>
                        <option value="初夏">初夏</option>
                        <option value="仲夏">仲夏</option>
                        <option value="晩夏">晩夏</option>
                        <option value="三夏">三夏</option>
                        <option value="初秋">初秋</option>
                        <option value="仲秋">仲秋</option>
                        <option value="晩秋">晩秋</option>
                        <option value="三秋">三秋</option>
                        <option value="初冬">初冬</option>
                        <option value="仲冬">仲冬</option>
                        <option value="晩冬">晩冬</option>
                        <option value="三冬">三冬</option>
                        <option value="暮">暮</option>
                    </select>
                </div>
                <div class="form-group" style="margin-top: 15px; border-top: 1px dashed #ddd; padding-top: 10px;">
                    <label class="form-label">作者名</label>
                    <input type="text" id="authorInput" class="text-input" list="authorList" value="西田上酢" oninput="onAuthorInputChanged()" onchange="onAuthorNameChange()">
                    <datalist id="authorList"></datalist>
                </div>
                <div class="form-group">
                    <label class="form-label">作者名（よみがな）</label>
                    <input type="text" id="authorKanaInput" class="text-input" list="authorKanaList" value="にしだうえす" oninput="onAuthorKanaInputChanged()">
                    <datalist id="authorKanaList"></datalist>
                </div>
                <div class="form-group" style="margin-top: 15px; border-top: 1px dashed #ddd; padding-top: 10px;">
                    <label class="form-label">作句日付</label>
                    <input type="date" id="sakkuDateInput" class="text-input">
                </div>
            </div>
        </div>
        <div class="btn-group">
            <button class="btn btn-outline" onclick="goToStep(1)">戻る</button>
            <button class="btn" onclick="goToStep3()">プレビューへ</button>
        </div>
    </div>

    <!-- 👁️ ステップ3：プレビュー -->
    <div id="step3" class="step-screen">
        <div class="step-title">【三】 登録プレビュー</div>
        <div class="global-header-area">
            <div class="header-row-top"><div id="previewBreadcrumb" class="breadcrumb"></div></div>
            <div class="header-row-bottom"><div id="previewAuthor" class="info-upper-tag"></div></div>
        </div>
        <div class="preview-screen-content">
            <div class="haiku-screen">
                <div id="previewPhrase" class="phrase"></div>
            </div>
        </div>
        <div class="btn-group" style="flex-direction: column; gap: 8px;">
            <div style="display: flex; gap: 10px; width: 100%;">
                <button id="submitKanseiBtn" class="btn" onclick="submitHaiku('完成句')">完成句</button>
                <button id="submitShitagakiBtn" class="btn btn-outline" onclick="submitHaiku('下書き')">下書き</button>
            </div>
            <button class="btn btn-outline" style="border: none; color: #888; padding: 6px 0;" onclick="goToStep(2)">← 修正する</button>
        </div>
    </div>

    <!-- 🎉 ステップ4：完了 -->
    <div id="step4" class="step-screen">
        <div class="step2-content" style="text-align: center;">
            <h2 id="completeTitle" style="font-size: 1.4rem; color: #2b2b2b; margin-bottom: 10px; font-weight: 500;">登録が完了しました</h2>
            <p style="font-size: 0.9rem; color: #666; line-height: 1.6;">句帳（スプレッドシート）へ保存されました。</p>
        </div>
        <div class="btn-group" style="max-width: 320px;">
            <button class="btn btn-outline" style="padding: 10px 0; font-size: 0.85rem;" onclick="finishAndReturn()">home</button>
            <button class="btn" style="padding: 10px 0; font-size: 0.85rem;" onclick="resetForm()">続けて作句</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
